name: Build and Test SDK
on:
  push:
    branches: ["v3", "feat/**"]
    paths-ignore:
      - "**.md" # Don't run CI on markdown changes.
  pull_request:
    branches: ["v3", "feat/**"]
    paths-ignore:
      - "**.md"

jobs:
  go-versions:
    uses: ./.github/workflows/go-versions.yml

  # Runs the common tasks (unit tests, lint, contract tests) for each Go version.
  test-linux:
    name: ${{ format('Linux, Go {0}, {1}', matrix.go-version, matrix.store) }}
    runs-on: ubuntu-latest
    needs: go-versions
    strategy:
      # Let jobs fail independently, in case it's a single version that's broken.
      fail-fast: false
      matrix:
        go-version: ${{ fromJSON(needs.go-versions.outputs.matrix) }}
        store: [Redis, Valkey]
        include:
          - store: Redis
            redis: true
            suffix: redis
          - store: Valkey
            valkey: true
            valkey_port: 6379
            suffix: valkey
    steps:
      - uses: launchdarkly/gh-actions/actions/persistent-stores@mk/sdk-1684/valkey
        with:
          redis: ${{ matrix.redis || false }}
          valkey: ${{ matrix.valkey || false }}
          valkey_port: ${{ matrix.valkey_port || '' }}
      - uses: actions/checkout@v4
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - uses: ./.github/actions/unit-tests
        with:
          lint: "true"
          suffix: ${{ matrix.suffix }}
      - uses: ./.github/actions/coverage
        with:
          enforce: "false"
          suffix: ${{ matrix.suffix }}

  test-windows-redis:
    name: ${{ format('Windows, Go {0}, Redis', matrix.go-version) }}
    runs-on: windows-2022
    needs: go-versions
    strategy:
      fail-fast: false
      matrix:
        go-version: ${{ fromJSON(needs.go-versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - uses: launchdarkly/gh-actions/actions/persistent-stores@mk/sdk-1684/valkey
        with:
          redis: true
      - name: Test
        run: go test -race ./...

  # Valkey isn't natively supported on Windows.
  # test-windows-valkey:
